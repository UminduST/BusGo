<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusGo | Conductor scanner</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;background:linear-gradient(135deg,#071b4d,#1557d6);display:grid;place-items:center;padding:20px}.scanner-card{width:min(100%,430px);padding:32px;text-align:center;color:#fff;border:1px solid #ffffff55;border-radius:28px;background:#ffffff18;box-shadow:0 25px 70px #0004;backdrop-filter:blur(25px)}.scanner-card h1{margin:14px 0 8px;font:800 32px Manrope,sans-serif}.scanner-card p{color:#dce6fb;font-size:14px;line-height:1.5}.scanner-icon{width:90px;height:90px;margin:auto;display:grid;place-items:center;color:#071b4d;border-radius:24px;background:#ffc107;box-shadow:0 10px 30px #ffc10755}.scanner-icon svg{width:45px;height:45px}.scan-input{width:100%;padding:15px;margin:20px 0 10px;color:#fff;border:1px solid #ffffff55;border-radius:12px;background:#ffffff15;text-align:center;font-size:18px;outline:0}.scan-button{width:100%;padding:15px;color:#071b4d;border:0;border-radius:12px;background:#ffc107;font-weight:800;cursor:pointer}.scan-result{min-height:24px;margin-top:18px;font-weight:700}.scan-result.valid{color:#b8ffcf}.scan-result.invalid{color:#ffb6aa}.back-link{display:inline-block;margin-top:22px;color:#dce6fb;font-size:12px}</style></head><body><main class="scanner-card"><div class="scanner-icon">▣</div><span class="kicker" style="color:#ffd54f">CONDUCTOR TOOLS / DEMO</span><h1>Verify a ticket</h1><p>Enter the passenger booking ID to simulate boarding validation. No scanner hardware required.</p><input class="scan-input" id="booking-id" placeholder="BG-82491" value="BG-82491" aria-label="Booking ID"><button class="scan-button" id="scan-button">Tap to Scan Ticket</button><div class="scan-result" id="scan-result"></div><a class="back-link" href="index.html">← Back to BusGo</a></main><script>document.querySelector('#scan-button').onclick=()=>{const result=document.querySelector('#scan-result');const valid=document.querySelector('#booking-id').value.trim().toUpperCase()==='BG-82491';result.textContent=valid?'✓ Ticket verified · Colombo to Kandy · Seat 12A':'Ticket not found. Try BG-82491.';result.className=`scan-result ${valid?'valid':'invalid'}`}</script></body></html>
